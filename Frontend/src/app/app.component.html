<div class="app-container">
  <!-- Header -->
  <header class="app-header">
    <h1>Find Your College 🎓</h1>
    <p class="subtitle">Search and explore colleges with ease</p>
  </header>

  <!-- Main content -->
  <main class="app-main">
    <!-- Search component -->
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <p>© {{ currentYear }} FindYourCollege. Built with ❤️ by {{ name }}.</p>

     <div class="developer-info">
    <span (click)="openLink(email)" class="info-item">📧 {{ email }}</span>
    <span (click)="openLink(linkedin)" class="info-item">💼 {{ linkedin }}</span>
    <br>
    <span (click)="openLink(leetcode)" class="info-item">🔗 {{ leetcode }}</span>
  </div>

  </footer>
</div>
